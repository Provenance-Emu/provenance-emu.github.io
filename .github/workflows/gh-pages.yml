name: github pages

on:
  push:
    branches:
      - main
  pull_request:
  # /install/ lists the latest GitHub releases of every app; refresh it without a push.
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      # Writes data/builds.json for the /install/ download list. In CI a failed
      # fetch fails the job, so the previous deployment stays live.
      - name: Fetch release notes
        run: node scripts/fetch-builds.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: hugo --minify

      - name: Write build SHA
        run: echo "${{ github.sha }}" > ./public/build-sha.txt

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: provenance-emu.com
