# /contact/ page: one block per channel. icon = Font Awesome classes (re-run
# scripts/build-fa-subset.py if you add a new one); url is optional.
address:
  - icon : "fab fa-discord"
    addressList:
      - listItem : "Discord"
        url : "https://discord.gg/4TK7PU5"
      - listItem : "Questions, help and beta chat"

  - icon : "fab fa-github"
    addressList:
      - listItem : "GitHub Issues"
        url : "https://github.com/Provenance-Emu/Provenance/issues"
      - listItem : "Bug reports and feature requests"

  - icon : "fas fa-book"
    addressList:
      - listItem : "Wiki"
        url : "https://wiki.provenance-emu.com/"
      - listItem : "Install guides, BIOS files, system notes"

  - icon : "fas fa-envelope"
    addressList:
      - listItem : "help@provenance-emu.com"
        url : "mailto:help@provenance-emu.com"
      - listItem : "Press and anything that isn't a bug"
